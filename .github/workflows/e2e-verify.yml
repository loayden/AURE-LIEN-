name: E2E CI Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "mongodb://127.0.0.1:27017/bout_test"
      JWT_SECRET: "test-secret-key-for-ci-only"
      NEXT_PUBLIC_URL: "http://localhost:3127"
      BOUT_MONGO_ONLY: "1"

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build Next.js app
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: npm run start -- -p 3127 &
        env:
          PORT: 3127

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3127

      - name: Run Playwright Journey QA
        run: node qa/qa-journey.cjs
        env:
          QA_BASE: "http://localhost:3127"
