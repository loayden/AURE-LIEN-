<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BOUT Instagram Story Ad</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #171513;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .story {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        color: #fff9ef;
        background: #171513;
      }

      .photo {
        position: absolute;
        inset: 0;
        background-image: url("../uploads/formal_lines.jpg");
        background-position: center center;
        background-size: cover;
        transform: scale(1.025);
      }

      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(23, 21, 19, 0.62) 0%, rgba(23, 21, 19, 0.08) 38%, rgba(23, 21, 19, 0.74) 100%),
          linear-gradient(90deg, rgba(23, 21, 19, 0.56) 0%, rgba(23, 21, 19, 0.12) 48%, rgba(23, 21, 19, 0.26) 100%);
      }

      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.18;
        mix-blend-mode: soft-light;
        background-image:
          linear-gradient(0deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 42px 42px;
      }

      .top {
        position: absolute;
        top: 92px;
        left: 72px;
        right: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 54px;
        font-weight: 400;
        line-height: 1;
      }

      .season {
        border: 1px solid rgba(255, 249, 239, 0.42);
        border-radius: 999px;
        padding: 18px 26px;
        font-size: 22px;
        font-weight: 600;
        line-height: 1;
        color: #fff9ef;
        background: rgba(23, 21, 19, 0.22);
        backdrop-filter: blur(16px);
      }

      .copy {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 198px;
      }

      .eyebrow {
        margin: 0 0 24px;
        font-size: 27px;
        font-weight: 700;
        line-height: 1.15;
        color: #d8c08a;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 116px;
        font-weight: 400;
        line-height: 0.93;
      }

      .subcopy {
        max-width: 680px;
        margin: 34px 0 0;
        font-size: 34px;
        font-weight: 500;
        line-height: 1.25;
        color: rgba(255, 249, 239, 0.86);
      }

      .footer {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
      }

      .cta {
        display: inline-flex;
        min-height: 88px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0 42px;
        font-size: 28px;
        font-weight: 800;
        line-height: 1;
        color: #171513;
        background: #fff9ef;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.26);
      }

      .url {
        max-width: 340px;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.25;
        text-align: right;
        color: rgba(255, 249, 239, 0.8);
      }
    </style>
  </head>
  <body>
    <main class="story" aria-label="BOUT Instagram Story ad">
      <div class="photo" aria-hidden="true"></div>
      <div class="shade" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="top">
        <div class="brand">BOUT</div>
        <div class="season">New arrivals</div>
      </header>

      <section class="copy">
        <p class="eyebrow">Luxury menswear and accessories</p>
        <h1>Refined daily edit.</h1>
        <p class="subcopy">Quiet layers, sharp essentials, and polished pieces ready for every day.</p>
      </section>

      <footer class="footer">
        <div class="cta">Shop the collection</div>
        <div class="url">Available now in the app</div>
      </footer>
    </main>
  </body>
</html>
