<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BOUT Instagram Story App Ad</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: #14110f;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .story {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        color: #fffaf2;
        background: #14110f;
      }

      .photo {
        position: absolute;
        inset: 0;
        background-image: url("./pexels-couple-story-source.jpg");
        background-position: center center;
        background-size: cover;
        transform: scale(1.018);
      }

      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(20, 17, 15, 0.36) 0%, rgba(20, 17, 15, 0.02) 38%, rgba(20, 17, 15, 0.82) 100%),
          linear-gradient(90deg, rgba(20, 17, 15, 0.66) 0%, rgba(20, 17, 15, 0.22) 44%, rgba(20, 17, 15, 0.1) 100%);
      }

      .warmth {
        position: absolute;
        inset: 0;
        opacity: 0.45;
        background:
          radial-gradient(circle at 18% 18%, rgba(216, 192, 138, 0.5), transparent 34%),
          radial-gradient(circle at 86% 76%, rgba(107, 72, 39, 0.42), transparent 30%);
        mix-blend-mode: soft-light;
      }

      .top {
        position: absolute;
        top: 104px;
        left: 70px;
        right: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 58px;
        font-weight: 400;
        line-height: 1;
        color: #fffaf2;
        text-shadow: 0 16px 42px rgba(0, 0, 0, 0.36);
      }

      .tag {
        display: inline-flex;
        min-height: 68px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 250, 242, 0.48);
        border-radius: 999px;
        padding: 0 28px;
        font-size: 23px;
        font-weight: 800;
        color: #fffaf2;
        background: rgba(20, 17, 15, 0.28);
        backdrop-filter: blur(18px);
      }

      .headline {
        position: absolute;
        top: 214px;
        left: 70px;
        max-width: 640px;
      }

      .eyebrow {
        margin: 0 0 22px;
        font-size: 26px;
        font-weight: 800;
        color: #d8c08a;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 102px;
        font-weight: 400;
        line-height: 0.94;
        color: #fffaf2;
        text-shadow: 0 18px 58px rgba(0, 0, 0, 0.42);
      }

      .panel {
        position: absolute;
        left: 56px;
        right: 56px;
        bottom: 122px;
        border: 1px solid rgba(255, 250, 242, 0.26);
        border-radius: 44px;
        padding: 34px 38px 36px;
        background: rgba(20, 17, 15, 0.62);
        box-shadow: 0 30px 100px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(22px);
      }

      .idea {
        display: grid;
        gap: 16px;
        margin-bottom: 28px;
      }

      .idea p {
        margin: 0;
        font-size: 29px;
        font-weight: 700;
        line-height: 1.22;
        color: rgba(255, 250, 242, 0.9);
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .cta {
        display: inline-flex;
        min-height: 84px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0 44px;
        font-size: 29px;
        font-weight: 900;
        color: #171513;
        background: #fffaf2;
        box-shadow: 0 24px 74px rgba(0, 0, 0, 0.28);
      }

      .benefit {
        max-width: 320px;
        font-size: 24px;
        font-weight: 800;
        line-height: 1.2;
        text-align: right;
        color: #d8c08a;
      }
    </style>
  </head>
  <body>
    <main class="story" aria-label="BOUT Instagram Story app ad">
      <div class="photo" aria-hidden="true"></div>
      <div class="shade" aria-hidden="true"></div>
      <div class="warmth" aria-hidden="true"></div>

      <header class="top">
        <div class="brand">BOUT</div>
        <div class="tag">Shop smarter</div>
      </header>

      <section class="headline">
        <p class="eyebrow">Luxury fashion in one app</p>
        <h1>Your look, curated.</h1>
      </section>

      <section class="panel">
        <div class="idea">
          <p>BOUT helps you discover curated fashion pieces and complete looks from trusted boutiques.</p>
          <p>Save favorites, compare styles, and checkout securely from one elegant shopping app.</p>
        </div>
        <div class="actions">
          <div class="cta">Open the app</div>
          <div class="benefit">New drops, styled edits, secure checkout</div>
        </div>
      </section>
    </main>
  </body>
</html>
